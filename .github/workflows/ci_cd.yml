name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ---------- Build Backend ----------
      - name: Build Backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product_store_backend:latest -f Dockerfile.backend .

      - name: Push Backend Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/product_store_backend:latest

      # ---------- Build Frontend ----------
      - name: Build Frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product_store_frontend:latest -f Dockerfile.frontend .

      - name: Push Frontend Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/product_store_frontend:latest

      # ---------- Optional EC2 Deployment ----------
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Backend
            docker pull ${{ secrets.DOCKER_USERNAME }}/product_store_backend:latest
            docker stop product_store_backend || true
            docker rm product_store_backend || true
            docker run -d \
              --name product_store_backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/product_store/.env \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/product_store_backend:latest

            # Frontend
            docker pull ${{ secrets.DOCKER_USERNAME }}/product_store_frontend:latest
            docker stop product_store_frontend || true
            docker rm product_store_frontend || true
            docker run -d \
              --name product_store_frontend \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/product_store_frontend:latest
