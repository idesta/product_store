name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/prd_str_cicd:latest .

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/prd_str_cicd:latest

      - name: DONE
        run: echo "Image pushed to Docker Hub!"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/prd_str_cicd:latest

            docker stop prd_str_cicd_demo || true
            docker rm prd_str_cicd_demo || true

            docker run -d \
              --name prd_str_cicd_demo \
              --restart unless-stopped \
              --env-file /home/ubuntu/product_store/.env \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/prd_str_cicd:latest
