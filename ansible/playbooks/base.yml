---
- name: Prepare All Nodes
  hosts: k8s
  become: true
  gather_facts: false # Must be false for the very first step if Python is missing

  pre_tasks:
    - name: Bootstrap Python3 for Ansible
      raw: apt-get update && apt-get install -y python3
      changed_when: false

    - name: Gather facts after Python is confirmed
      setup: # Manually trigger fact gathering now that Python exists

  tasks:
    - name: Update and install dependencies
      apt:
        name: [curl, apt-transport-https, ca-certificates, gnupg, git]
        state: present
        update_cache: yes

    - name: Disable Swap
      shell: "swapoff -a && sed -i '/ swap / s/^/#/' /etc/fstab"

    - name: Load Kernel Modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure modules load on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Apply Sysctl params (Bridge Networking)
      sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: yes
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Install Containerd
      apt:
        name: containerd
        state: present

    - name: Configure Containerd (SystemdCgroup)
      shell: |
        mkdir -p /etc/containerd
        containerd config default | tee /etc/containerd/config.toml > /dev/null
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      notify: Restart Containerd

  handlers:
    - name: Restart Containerd
      systemd:
        name: containerd
        state: restarted
