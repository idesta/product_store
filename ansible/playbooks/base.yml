- name: Base system setup
  hosts: k8s
  become: true
  tasks:
    - name: Update system
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install basic packages
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present
