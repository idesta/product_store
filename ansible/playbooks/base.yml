---
- name: Base system setup (containerd runtime)
  hosts: k8s
  become: true

  tasks:
    ######################################################################
    # System prep
    ######################################################################
    - name: Update system
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install basic packages
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    ######################################################################
    # Disable swap (mandatory)
    ######################################################################
    - name: Disable swap
      shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab

    ######################################################################
    # Kernel modules
    ######################################################################
    - name: Ensure kernel modules config
      copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load kernel modules now
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    ######################################################################
    # Sysctl
    ######################################################################
    - name: Configure sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply sysctl params
      command: sysctl --system

    ######################################################################
    # containerd
    ######################################################################
    - name: Install containerd
      apt:
        name: containerd
        state: present

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory

    - name: Generate containerd default config
      command: containerd config default
      register: containerd_cfg
      changed_when: false

    - name: Write containerd config
      copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_cfg.stdout }}"

    - name: Enable SystemdCgroup
      replace:
        path: /etc/containerd/config.toml
        regexp: "SystemdCgroup = false"
        replace: "SystemdCgroup = true"

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    ######################################################################
    # kubelet CRI FIX
    ######################################################################
    - name: Ensure kubelet systemd override directory exists
      file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: "0755"

    - name: Configure kubelet to use containerd
      copy:
        dest: /etc/systemd/system/kubelet.service.d/20-containerd.conf
        mode: "0644"
        content: |
          [Service]
          Environment="KUBELET_EXTRA_ARGS=--container-runtime-endpoint=unix:///run/containerd/containerd.sock"
