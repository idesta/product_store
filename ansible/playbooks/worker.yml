---
- name: Join Workers
  hosts: workers
  become: true
  tasks:
    # --- 1. REPO SETUP (Updated to v1.31) ---
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes GPG key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Dearmor GPG key
      shell: gpg --dearmor < /tmp/kubernetes-release.key > /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /"
        state: present
        filename: kubernetes
        update_cache: yes

    # --- 2. INSTALL TOOLS ---
    - name: Install K8s Tools
      apt:
        name: [kubelet, kubeadm]
        state: present

    # --- 3. JOIN THE CLUSTER ---
    - name: Join Cluster
      # This pulls the token from the virtual 'K8S_TOKEN_HOLDER' host
      # we created in the master.yml
      command: "{{ hostvars['K8S_TOKEN_HOLDER']['token'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
