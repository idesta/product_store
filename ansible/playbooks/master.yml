---
- name: Setup Master
  hosts: masters
  become: true
  vars:
    ansible_remote_tmp: /tmp/.ansible/tmp

  tasks:
    # --- ADD THIS TASK HERE ---
    - name: 0. Wait for apt lock and disable unattended upgrades
      shell: |
        systemctl stop unattended-upgrades || true
        systemctl disable unattended-upgrades || true
        # Kill any existing apt/dpkg processes if they are stuck
        killall apt apt-get unattended-upgrade-daemon || true
        # Remove the lock files manually if necessary
        rm -f /var/lib/dpkg/lock-frontend
        rm -f /var/lib/apt/lists/lock
        # Reconfigure dpkg in case it was interrupted
        dpkg --configure -a
      ignore_errors: true

    - name: Ensure networking dependencies are installed
      apt:
        name:
          - conntrack
          - socat
        state: present
        update_cache: yes
        lock_timeout: 300 # Added timeout to wait for locks naturally

    - name: Add K8s Repo & Install Tools
      shell: |
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list

    - name: Install K8s binaries
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: yes

    - name: Kubeadm Init
      command: >
        kubeadm init 
        --pod-network-cidr=10.244.0.0/16 
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Setup Kubeconfig for Root user
      file:
        path: /root/.kube
        state: directory
        mode: "0755"

    - name: Copy admin.conf to Root home
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: "0600"

    - name: Install Flannel CNI
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml --force
      register: cni_result
      until: cni_result is succeeded
      retries: 3
      delay: 10

    - name: Generate Join Token
      command: kubeadm token create --print-join-command
      register: join_command

    - name: Share Join Token with Workers
      add_host:
        name: "K8S_TOKEN_HOLDER"
        token: "{{ join_command.stdout }}"
